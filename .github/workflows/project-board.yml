name: Project Board Snapshot

on:
  # `issues` events fire only for issues in `totaldrop-app/.github`.
  # The other 12 organization repositories rely on `repository_dispatch`
  # (`sync-project-board`) or the 15-minute `schedule` cron below.
  issues:
    types: [opened, closed, reopened, transferred]
  pull_request:
    paths:
      - ".github/workflows/project-board.yml"
      - "tools/export_project_board.py"
      - "tools/test_export_project_board.py"
  push:
    branches: [main]
  repository_dispatch:
    types: [sync-project-board]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  # Every writing run (push, issues, repository_dispatch, schedule, workflow_dispatch)
  # shares a single group so concurrent runs cannot mutate Project #1 at the same time.
  # Pull-request runs are strictly export-only (read-only) and stay isolated per PR.
  group: ${{ github.event_name == 'pull_request' && format('project-board-pr-{0}', github.event.pull_request.number) || 'project-board-org-sync' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  snapshot:
    name: Export Project #1 Kanban Snapshot
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'totaldrop-app/.github'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reconcile and export sanitized Project #1 board snapshot
        env:
          ORG_PROJECT_TOKEN: ${{ secrets.ORG_PROJECT_TOKEN }}
          GH_PUBLIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          reconcile_flag=""
          if [ "$EVENT_NAME" != "pull_request" ]; then
            reconcile_flag="--reconcile"
          fi
          python3 tools/export_project_board.py \
            --org totaldrop-app \
            --project-number 1 \
            $reconcile_flag \
            --out-dir dist/project-board \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload Project #1 snapshot artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-1-snapshot
          path: dist/project-board/
          if-no-files-found: ignore
          retention-days: 30
